<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CLEO · Móvil, menú Más</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECEEF5}
.cl{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0E1328;-webkit-font-smoothing:antialiased}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cnt{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#0E1328;color:#FFFFFF;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center}
.mi{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 16px;border-radius:16px;text-decoration:none;color:#FFFFFF;font-size:17px;font-weight:600}
.mi .i{width:22px;height:22px;color:#AEB8FF}
.mi .sub{margin-left:auto;font-size:13.5px;font-weight:500;color:#8E94AE}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:58px;text-decoration:none;color:#5A6078;font-size:11.5px;font-weight:600;white-space:nowrap}
.tb .pill{width:48px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.tb.on{color:#0E1328;font-weight:800}
.tb.on .pill{background:#E4E8FF;color:#3F4BD0}
</style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20h-5.5v-5.5h-6V20H3.5z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .8 3.2 2.6 3.5 5.2"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01" stroke-width="3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-8M11 20V5M17 20v-6M3 20h18"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10h6M9 14h4"/></symbol>
<symbol id="i-case" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4.5h6V7M3 12.5h18"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5.5-5 4 3.5 2.5-2 4 3.5"/></symbol>
</svg>
<div class="cl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECEEF5">
<div aria-hidden="true" style="padding: 22px 20px">
<div style="font-size: 14px; color: #5A6078">lunes 12 de octubre</div>
<div style="margin-top: 6px; font-size: 28px; font-weight: 800; letter-spacing: -0.035em">Buenas tardes, emprendedor</div>
<div style="margin-top: 18px; height: 180px; border-radius: 26px; background: #0E1328"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(14,19,40,0.45)"></div>

<div role="dialog" aria-label="Más" style="position: absolute; left: 8px; right: 8px; bottom: 94px; background: #0E1328; border-radius: 28px; padding: 12px 10px 12px; box-shadow: 0 -16px 40px -18px rgba(14,19,40,0.6)">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); margin: 0 auto 12px"></div>
<div style="display: flex; align-items: center; gap: 12px; margin: 0 4px 8px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.07)">
<span role="img" aria-label="Logo de Racing Rush" style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #FFFFFF; box-shadow: inset 0 0 0 2.5px {{negocio}}; display: grid; place-items: center; color: {{negocio}}"><svg class="i"><use href="#i-img"></use></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 15.5px; font-weight: 700; color: #FFFFFF">Racing Rush</span><span style="font-size: 13px; color: #8E94AE">Danna</span></span>
</div>
<a href="#" class="mi"><svg class="i"><use href="#i-user"></use></svg>Clientes</a>
<a href="#" class="mi"><svg class="i"><use href="#i-db"></use></svg>Inventario y costos</a>
<a href="#" class="mi"><svg class="i"><use href="#i-flag"></use></svg>Eventos</a>
<a href="#" class="mi"><svg class="i"><use href="#i-chart"></use></svg>Resumen</a>
<div style="height: 1px; background: rgba(255,255,255,0.12); margin: 6px 16px"></div>
<a href="#" class="mi"><svg class="i"><use href="#i-book"></use></svg>Mis productos<span class="sub">12 productos</span></a>
<a href="#" class="mi"><svg class="i"><use href="#i-case"></use></svg>Mi negocio</a>
<a href="#" class="mi"><svg class="i"><use href="#i-user"></use></svg>Mi cuenta</a>
</div>

<nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #DADDE8; padding: 6px 10px 22px; display: flex; justify-content: space-between">
<a href="#" class="tb"><span class="pill"><svg class="i"><use href="#i-home"></use></svg></span>Inicio</a>
<a href="#" class="tb"><span class="pill"><svg class="i"><use href="#i-sun"></use></svg><span class="cnt" style="position: absolute; top: -6px; right: 0">6</span></span>Hoy</a>
<a href="#" class="tb"><span class="pill"><svg class="i"><use href="#i-users"></use></svg></span>Oportunidades</a>
<a href="#" class="tb"><span class="pill"><svg class="i"><use href="#i-bag"></use></svg></span>Pedidos</a>
<a href="#" class="tb"><span class="pill"><svg class="i"><use href="#i-cash"></use></svg></span>Ingresos</a>
<a href="#" class="tb on" aria-current="true"><span class="pill"><svg class="i" style="stroke-width: 2.1"><use href="#i-dots"></use></svg></span>Más</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"negocio":{"editor":"color","default":"#0F7C80","options":["#0F7C80","#C2367A","#E06A1B","#2F6FD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { negocio: this.props.negocio ?? '#0F7C80' }; }
}
</script>
