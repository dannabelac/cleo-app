<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLEO -- SOLO SIMULACIÓN LOCAL</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ECEEF5; color: #0E1328; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <!-- ══════════════════════════════════════════════════════════════════
         ENTRADA EXCLUSIVA DE SIMULACIÓN LOCAL -- nunca es parte de
         index.html, nunca se incluye en `npm run build` (Vite solo empaqueta
         el entry configurado -- index.html -- por defecto; este archivo
         suelto no aparece en ningún rollupOptions.input, así que un build de
         producción ni lo toca) y nunca se abre con `npm run dev` normal (ese
         comando sirve index.html en la raíz; esta página solo responde en
         /simulacion.html, una ruta que hay que pedir a propósito).

         Inyecta una sesión falsa en localStorage para saltarse el login real
         ÚNICAMENTE cuando las 2 condiciones de abajo se cumplen las 2 --
         si cualquiera falla, esta página se comporta exactamente como
         index.html (sin inyectar nada, exige login real):
           1. location.hostname === 'localhost'.
           2. VITE_SUPABASE_URL (la variable de entorno YA inyectada por
              Vite en este build/dev-serve, nunca algo que esta página
              decida) coincide EXACTAMENTE con el patrón
              http://localhost:<puerto> -- un proyecto real de Supabase
              (cleo-pruebas o producción) SIEMPRE es https://xxxx.supabase.co,
              nunca puede coincidir con este patrón. Si apunta a Supabase o a
              cualquier otro destino, el acceso simulado se niega solo, sin
              intervención manual.
         Documentado a propósito: estas pruebas verifican el login
         SIMULADO, nunca autenticación real -- ver tests/sim/README.md.
    ══════════════════════════════════════════════════════════════════ -->
    <div id="root"></div>
    <script type="module">
      (function () {
        var url = import.meta.env.VITE_SUPABASE_URL || "";
        var esOrigenLocalDeSimulacion = location.hostname === "localhost" && /^http:\/\/localhost:\d+$/.test(url);
        if (!esOrigenLocalDeSimulacion) return; // nunca inyecta nada contra Supabase real ni ningún otro destino
        var key = "sb-localhost-auth-token";
        if (!localStorage.getItem(key)) {
          var lejano = Math.floor(Date.now() / 1000) + 60 * 60 * 24 * 365 * 5;
          localStorage.setItem(key, JSON.stringify({
            access_token: "simulado-no-es-un-jwt-real",
            token_type: "bearer",
            expires_in: 60 * 60 * 24 * 365 * 5,
            expires_at: lejano,
            refresh_token: "simulado-no-es-un-jwt-real",
            user: { id: "11111111-1111-1111-1111-111111111111", aud: "authenticated", role: "authenticated", email: "simulacion@cleo.local" },
          }));
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
